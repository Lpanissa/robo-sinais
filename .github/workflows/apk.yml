name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Marcar a versao (o app compara com a versao publicada para se atualizar)
        run: echo "{\"sha\":\"$GITHUB_SHA\"}" > build.json

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Alinhar versoes ao Expo SDK
        run: npx expo install --fix

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Usar a chave de teste fixa
        run: cp assinatura-teste/debug.keystore android/app/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: robo-sinais-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publicar o APK numa versao do repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk robo-sinais.apk
          gh release create "apk-${{ github.run_number }}" robo-sinais.apk \
            --title "Robô de Sinais APK #${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)"

      - name: Publicar como versao atual (o app baixa daqui para se atualizar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app robo-sinais.apk --title "Robô de Sinais (versão atual do app)" --notes-file novidades.txt --target "$GITHUB_SHA"
