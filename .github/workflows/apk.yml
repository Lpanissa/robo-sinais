name: Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Usar a chave de teste fixa
        run: cp assinatura-teste/debug.keystore android/app/debug.keystore

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: robo-sinais-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publicar o APK numa versao do repositorio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk robo-sinais.apk
          gh release create "apk-${{ github.run_number }}" robo-sinais.apk \
            --title "Robô de Sinais APK #${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%s)"
